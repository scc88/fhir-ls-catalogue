<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQI Type 2 · Document + product data | FHIR for Global Regulatory Affairs</title>
<meta name="description" content="PQI Type 2 showcases: product, packaging, ingredient, site and authorization master data travel with the CMC documents as FHIR resources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pqi-types.css">
<style>
  .idcard { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2px; background: var(--sep); border-radius: 16px; overflow: hidden; }
  .idcard > div { background: var(--surface); padding: 12px 14px; cursor: pointer; }
  .idcard > div:hover { background: var(--accent-soft); }
  .idcard label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; cursor: pointer; }
  .idcard span.v { display: block; font-weight: 600; margin-top: 2px; }
  .idcard .fp { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-top: 4px; overflow-wrap: anywhere; }
  .form-row { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sep); font-size: 14px; }
  .form-row:last-child { border-bottom: 0; }
  .form-row label { color: var(--muted); font-size: 13px; }
  .form-row .val { background: var(--fill); border-radius: 8px; padding: 6px 10px; min-height: 32px; transition: background .4s; }
  .form-row .val.filled { background: var(--accent-soft); }
  .form-row .src { grid-column: 2; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .ops td, .ops th { font-size: 12.5px; padding: 6px 8px; }
  .ops .ids { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 820px) { .form-row { grid-template-columns: 1fr; } .form-row .src { grid-column: 1; } }
  .t1quote { max-height: 420px; overflow: auto; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; background: #fcfcfd; }
  .fhirtog { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; margin: 0 0 16px; }
  .fhirtog input { width: 18px; height: 18px; accent-color: var(--t2); margin: 0; }
  .cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
  .cmp-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .cmp-h h3 { margin: 0; }
  .tag { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
  .tag.t1 { color: var(--t1); background: var(--t1-soft); } .tag.t2 { color: var(--t2); background: var(--t2-soft); }
  .cmp-t2, .orgs { box-shadow: inset 0 0 0 2px var(--t2); }
  .t1box { border: 1px dashed var(--line); border-radius: 14px; padding: 14px 16px; background: #fcfcfd; }
  .t1tbl { border: 1px solid var(--sep); border-radius: 10px; overflow: hidden; }
  .t1r { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); width: 100%; border: 0; border-top: 1px solid var(--sep); background: var(--surface); font: inherit; font-size: 14px; line-height: 1.4; text-align: left; padding: 0; color: var(--ink); }
  .t1r > span { padding: 9px 12px; } .t1r.hd { border-top: 0; background: var(--fill); font-weight: 700; font-size: 13px; }
  .t1r.dim { color: var(--muted); } .t1r.pk { cursor: pointer; min-height: 44px; } .t1r.pk:hover { background: var(--t2-soft); }
  .pk.on { background: var(--t2-soft) !important; box-shadow: inset 0 0 0 2px var(--t2); }
  .t2grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .t2c { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); background: #fafafb; border: 1px solid var(--sep); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .t2c:hover { border-color: var(--t2); }
  .t2top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .t2top .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .new { font-size: 11px; font-weight: 700; color: #8a4b00; background: #fff1de; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .t2v { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
  .facts { display: grid; grid-template-columns: fit-content(46%) minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: 12.5px; line-height: 1.4; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .fk { color: var(--warn); font-weight: 700; margin-left: 2px; }
  .fpath { display: none; font-family: var(--mono); font-size: 11px; color: var(--t2); overflow-wrap: anywhere; }
  .showfhir .fpath { display: block; }
  .orgs { margin-top: 16px; }
  .orggrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  .orgc { display: flex; flex-direction: column; gap: 8px; background: #fafafb; border: 1px solid var(--sep); border-radius: 14px; padding: 14px 16px; }
  .orgc.mah { background: #f2fafb; border: 2px solid var(--t2); }
  .oname { font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .roles { display: flex; flex-wrap: wrap; gap: 4px; }
  .role { font-size: 11.5px; font-weight: 600; color: #0b5563; background: var(--t2-soft); padding: 2px 8px; border-radius: 999px; }
  .role.mah { color: #fff; background: var(--t2); }
  .nextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 16px; }
  .nextbar p { margin: 0; flex: 1 1 420px; font-size: 15px; line-height: 1.5; }
  @media (max-width: 1100px) { .cmp { grid-template-columns: 1fr; } .orggrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .t2grid, .orggrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<noscript>This showcase needs JavaScript.</noscript>
<script src="data/t2.js"></script>
<script src="pqi-types.js"></script>
<script>
(function () {
  const D = PQIDATA.t2, esc = PT.esc;
  const db = PT.db(Object.values(D.resources));
  const R = (k) => db.get(k);
  const docs = D.docs.map((d) => ({ ...d, comp: d.composition, code: PT.docCode(d.composition), title: PT.shortTitle(d.composition.title) }));
  const m23 = docs[0].comp;
  const mpd = R(m23.subject[0].reference), applicant = R(m23.author[0].reference);
  const mid = (db.byType.get("ManufacturedItemDefinition") || [])[0];
  const ra = (db.byType.get("RegulatedAuthorization") || [])[0];
  const packs = db.byType.get("PackagedProductDefinition") || [];
  const ings = db.byType.get("Ingredient") || [];
  const orgs = db.byType.get("Organization") || [];
  const api = ings.find((i) => /Active/i.test(PT.cc(i.role)));
  const apiSd = R(api.substance.code.reference.reference);
  const insp = (k) => PT.inspectResource(k, db);
  const refLink = (r, txt) => `<a href="#" data-ref="${esc(r.resourceType + "/" + r.id)}">${esc(txt || PT.label(r))}</a>`;
  const wire = (el) => el.querySelectorAll("[data-ref]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); insp(a.dataset.ref); }));
  const strength = (i) => { const s = ((i.substance || {}).strength || [])[0] || {}; return s.textPresentation || ""; };
  const edqm = (cc) => { const c = (cc && cc.coding || [])[0]; return c && /edqm/.test(c.system) ? `<span class="chip rt">EDQM ${esc(c.code)}</span>` : ""; };
  const shelf = (p) => ((p.packaging || {}).shelfLifeStorage || []).map((s) => ({ zone: PT.cc(s.type).replace(/^Shelf life of the medicinal product as packaged for sale - /, ""), months: s.periodDuration ? s.periodDuration.value : null, store: ((s.specialPrecautionsForStorage || [])[0] || {}).text || "" }));

  // ====================== 1. Product data added in Type 2 ======================
  // Made-up values (†) that fill gaps in the synthetic example bundle, so every structured field shows.
  const SUPP = {
    unii: "SKR9M2X7QF",
    address: { "sakura-pharma": { line: ["1-5-20 Sakuradai, Nerima-ku"], city: "Tokyo", state: "Tokyo (prefecture)", postalCode: "176-0002", country: "JP" } },
    state: { "iroha-corp": "Zhejiang", "aparna-pharm": "Dhaka Division", "kunchen-sa": "Bavaria", "dakina-analytica": "Ticino", "pack-alpha": "Basel-Landschaft", "cocopharma": "Basel-Landschaft", "warehouse-yaohai": "Anhui", "heto-corp": "Hesse", "abcr-gmbh": "Baden-Württemberg" },
    postal: { "aparna-pharm": "1212" },
    duns: { "sakura-pharma": "690123457", "leukocare-science": "081234567", "warehouse-yaohai": "554321098", "heto-corp": "342198765", "abcr-gmbh": "316547890" },
    fei: { "sakura-pharma": "3009876543", "heto-corp": "3011223344", "abcr-gmbh": "3011223355" },
    roles: { "leukocare-science": ["Microbiological testing"], "warehouse-yaohai": ["Storage and distribution"], "heto-corp": ["Starting material supply"], "abcr-gmbh": ["Reference standard supply"] },
  };
  const COUNTRY = { CN: "China", BD: "Bangladesh", DE: "Germany", CH: "Switzerland", US: "United States", JP: "Japan" };
  const fv = (v, fake) => v ? `${esc(v)}${fake ? '<sup class="fk" title="Made up for this showcase">†</sup>' : ""}` : '<span class="muted">—</span>';
  const kv = (rows) => `<dl class="facts">${rows.map(([k, v, fake]) => `<dt>${esc(k)}</dt><dd>${fv(v, fake)}</dd>`).join("")}</dl>`;
  const codeOf = (cc) => ((cc && cc.coding) || [])[0] || {};
  const qty = (q) => q ? `${q.value} ${q.unit || q.code || ""}`.trim() : "";
  let pick = "substance", showFhir = false;

  function added(main) {
    // Type 1 table, read from the Type 1 narrative
    const t1doc = new DOMParser().parseFromString(D.t1Intro, "text/html");
    const MAP = [[/name of the drug substance/i, "substance"], [/^Dosage form/i, "doseform"], [/^Strength/i, "strength"], [/^Route/i, "route"], [/^Primary packaging/i, "packs"]];
    const t1rows = [...t1doc.querySelectorAll("table tr")].slice(1).map((tr) => {
      const [a, b] = [...tr.querySelectorAll("td,th")].map((td) => td.textContent.replace(/\s+/g, " ").trim());
      const m = MAP.find(([re]) => re.test(a || ""));
      return { label: a || "", value: b || "", id: m ? m[1] : null };
    });
    const sdName = (t) => ((apiSd.name || []).find((n) => new RegExp(t, "i").test(PT.cc(n.type))) || {}).name;
    const unii = ((apiSd.identifier || []).find((i) => /unii/i.test(i.system || "")) || {}).value;
    const cas = ((apiSd.identifier || []).find((i) => /cas/i.test(i.system || "")) || {}).value;
    const mw = (apiSd.molecularWeight || [])[0];
    const st = ((api.substance || {}).strength || [])[0] || {};
    const df = mpd.combinedPharmaceuticalDoseForm, rt = (mpd.route || [])[0];
    const nm = mpd.name[0];
    const cards = [
      { id: "product", label: "Product", isNew: true, value: nm.productName, ref: mpd, fhir: "Composition.subject → MedicinalProductDefinition",
        rows: [["Identifier", ((mpd.identifier || [])[0] || {}).value], ["Name type", PT.cc(nm.type)]].concat((nm.part || []).map((p) => [PT.cc(p.type), p.part])) },
      { id: "substance", label: "Active substance", value: PT.label(apiSd), ref: apiSd, fhir: "Ingredient.substance.code → SubstanceDefinition",
        rows: [["INN", sdName("INN")], ["USAN", sdName("USAN")], ["UNII", unii || SUPP.unii, !unii], ["CAS number", cas], ["Company code", sdName("Company code")], ["Molecular formula", (apiSd.structure || {}).molecularFormula], ["Molecular weight", mw ? `${qty(mw.amount)} (${PT.cc(mw.type)})` : ""]] },
      { id: "doseform", label: "Dose form", value: PT.cc(df), ref: mpd, fhir: "MedicinalProductDefinition.combinedPharmaceuticalDoseForm",
        rows: [["Code system", /edqm/.test(codeOf(df).system || "") ? "EDQM Standard Terms" : codeOf(df).system], ["Code", codeOf(df).code], ["Unit of presentation", `${PT.cc(mid.unitOfPresentation)} · EDQM ${codeOf(mid.unitOfPresentation).code}`]] },
      { id: "strength", label: "Strength", value: st.textPresentation || strength(api), ref: api, fhir: "Ingredient.substance.strength",
        rows: [["Numerator", qty((st.presentationRatio || {}).numerator) + " (UCUM)"], ["Denominator", qty((st.presentationRatio || {}).denominator)], ["Basis", PT.cc(st.basis)], ["Reference substance", PT.label(apiSd)]] },
      { id: "route", label: "Route", value: PT.cc(rt), ref: mpd, fhir: "MedicinalProductDefinition.route",
        rows: [["Code system", /edqm/.test(codeOf(rt).system || "") ? "EDQM Standard Terms" : codeOf(rt).system], ["Code", codeOf(rt).code]] },
      { id: "packs", label: "Packs", value: `${packs.length} packaged products`, ref: packs[0], fhir: `PackagedProductDefinition × ${packs.length}`,
        rows: packs.map((p, i) => ["Pack " + (i + 1), PT.cc(p.type)]) },
      { id: "ma", label: "Marketing authorization", isNew: true, value: ra.identifier[0].value, ref: ra, fhir: "RegulatedAuthorization",
        rows: [["Type", PT.cc(ra.type)], ["Region", (ra.region || []).map((r) => `${PT.cc(r)} (ISO 3166: ${codeOf(r).code})`).join(", ")], ["Status", PT.cc(ra.status)], ["Holder", (R((ra.holder || {}).reference) || {}).name]] },
    ];
    // organizations: holder first, then those with an operation, then the rest
    const holderRef = (ra.holder || {}).reference;
    const roleMap = {};
    (mpd.operation || []).forEach((o) => (o.organization || []).forEach((x) => { (roleMap[x.reference] = roleMap[x.reference] || []).push(PT.cc((o.type || {}).concept) || "Operation not coded"); }));
    const orgKey = (o) => "Organization/" + o.id;
    const ordered = [...orgs].sort((a, b) => ((orgKey(b) === holderRef) - (orgKey(a) === holderRef)) || (!!roleMap[orgKey(b)] - !!roleMap[orgKey(a)]));
    const idv = (o, re) => ((o.identifier || []).find((i) => re.test(i.system || "")) || {}).value;
    const orgCards = ordered.map((o) => {
      const real = ((o.contact || []).find((c) => c.address) || {}).address || (o.address || [])[0];
      const fa = SUPP.address[o.id], a = real || fa || {}, fakeAddr = !real && !!fa;
      const roles = orgKey(o) === holderRef ? ["Applicant", "Marketing authorization holder"] : roleMap[orgKey(o)] || (SUPP.roles[o.id] || []).map((r) => r + " †");
      const duns = idv(o, /519\.1/), fei = idv(o, /4\.82/);
      const state = a.state || SUPP.state[o.id], postal = a.postalCode || SUPP.postal[o.id];
      return { o, mah: orgKey(o) === holderRef, roles, rows: [
        ["Street", (a.line || []).join(", "), fakeAddr], ["City", a.city, fakeAddr], ["State / province", state, fakeAddr || (!a.state && !!SUPP.state[o.id])],
        ["Postal code", postal, fakeAddr || (!a.postalCode && !!SUPP.postal[o.id])], ["Country", a.country ? `${COUNTRY[a.country] || a.country} (${a.country})` : "", fakeAddr],
        ["DUNS", duns || SUPP.duns[o.id], !duns && !!SUPP.duns[o.id]], ["FEI", fei || SUPP.fei[o.id], !fei && !!SUPP.fei[o.id]]] };
    });
    const NOTES = {
      substance: "Type 1 names the substance in prose. Type 2 links it to a SubstanceDefinition with its identifiers, formula and weight.",
      doseform: "Type 1 says “film-coated tablet”. Type 2 adds the EDQM standard term, so every agency reads the same code.",
      strength: "Type 1 states the strength as text. Type 2 carries it as a number and unit that systems can compare and check.",
      route: "Type 1 says “Oral, to be swallowed whole”. Type 2 adds the EDQM route code.",
      packs: "Type 1 describes the packaging in one sentence. Type 2 has a separate record for each pack.",
      product: "Not in the Type 1 table: the document now names the product it is about, with its identifier and name parts.",
      ma: "Not in the Type 1 table: the authorization, its region, status and holder travel with the document.",
    };
    const nLinked = t1rows.filter((r) => r.id).length;
    main.innerHTML = PT.head("Showcase 1 · Product data added in Type 2", "What Type 2 adds to the Type 1 document",
      "The narrative is exactly the same as in Type 1. What changes is that the product facts written in it are now also carried as structured FHIR resources inside the same document, each one split into separate, coded fields. Select a row on either side to see its match.") +
      `<label class="fhirtog"><input type="checkbox" id="fhirTog" ${showFhir ? "checked" : ""}> Show the FHIR behind each value</label>
      <div class="cmp ${showFhir ? "showfhir" : ""}" id="cmp">
        <section class="card cmp-t1"><div class="cmp-h"><h3>Type 1 · the document as authored</h3><span class="tag t1">Narrative only</span></div>
          <p class="sub">Module 2.3, section 2.3.1 General information. People can read it, but software can only find these values by parsing the table.</p>
          <div class="t1box"><b>2.3.1 General information</b><div class="muted small" style="margin:2px 0 10px">Table 1: General information</div>
            <div class="t1tbl"><div class="t1r hd"><span>Product attribute</span><span>Details</span></div>
            ${t1rows.map((r) => r.id ? `<button type="button" class="t1r pk" data-pick="${r.id}"><span>${esc(r.label)}</span><span><b>${esc(r.value)}</b></span></button>` : `<div class="t1r dim"><span>${esc(r.label)}</span><span>${esc(r.value)}</span></div>`).join("")}</div></div>
          <p class="muted small" style="margin:10px 0 0">Rows in grey have no structured counterpart in this example.</p></section>
        <section class="card cmp-t2"><div class="cmp-h"><h3>Type 2 · same narrative, plus product data</h3><span class="tag t2">Structured</span></div>
          <p class="sub">The same section 2.3.1 travels unchanged. Alongside it, the document's Product data section carries each fact as a FHIR resource, split into separate fields with standard codes that any system can read directly.</p>
          <div class="t2grid">${cards.map((c) => `<button type="button" class="t2c pk" data-pick="${c.id}">
            <span class="t2top"><span class="lbl">${esc(c.label)}</span>${c.isNew ? '<span class="new">New in Type 2</span>' : ""}</span>
            <span class="t2v">${esc(c.value)}</span>${kv(c.rows)}
            <a href="#" class="fpath" data-ref="${esc(c.ref.resourceType + "/" + c.ref.id)}">${esc(c.fhir)} ›</a></button>`).join("")}</div></section>
      </div>
      <section class="card orgs ${showFhir ? "showfhir" : ""}"><div class="cmp-h"><h3>Applicant, marketing authorization holder and sites</h3><span class="new">New in Type 2</span></div>
        <p class="sub">Every organization named in the dossier is an Organization resource in the Type 2 document, with its role, its DUNS and FEI numbers, and an address split into street, city, state or province, postal code and ISO country code. A Type 1 document only mentions them in prose.</p>
        <div class="orggrid">${orgCards.map((c) => `<article class="orgc ${c.mah ? "mah" : ""}"><a href="#" class="oname" data-ref="Organization/${esc(c.o.id)}">${esc(c.o.name)}</a>
          <div class="roles">${c.roles.map((r) => `<span class="role ${c.mah ? "mah" : ""}">${esc(r)}</span>`).join("")}</div>${kv(c.rows)}
          <span class="fpath">Organization.contact.address · Organization.identifier</span></article>`).join("")}</div>
        <p class="small" style="color:var(--warn);margin:14px 0 0">Values marked † are made up for this showcase to fill gaps in the synthetic Sakura Bloom bundle. All organizations, addresses and identifiers are fictitious.</p></section>
      <div class="card nextbar"><p><b>${nLinked} facts from the Type 1 table, plus the product, its authorization and ${orgs.length} organizations, now arrive as data.</b> <span id="pickNote"></span></p>
        <a class="btn primary" href="#reuse">Next: Product data across the 20 documents →</a></div>`;
    const sync = () => {
      PT.$$("[data-pick]", main).forEach((el) => { const on = el.dataset.pick === pick; el.classList.toggle("on", on); el.setAttribute("aria-pressed", on); });
      PT.$("#pickNote", main).textContent = pick ? NOTES[pick] : "Select a row or card to compare.";
    };
    PT.$$("[data-pick]", main).forEach((el) => el.addEventListener("click", (e) => { if (e.target.closest("[data-ref]")) return; pick = pick === el.dataset.pick ? null : el.dataset.pick; sync(); }));
    PT.$("#fhirTog", main).onchange = (e) => { showFhir = e.target.checked; PT.$$("#cmp, .orgs", main).forEach((x) => x.classList.toggle("showfhir", showFhir)); };
    wire(main);
    sync();
  }

  // ====================== 2. Product data across the 20 documents ======================
  const SCEN = {
    name: { label: "The invented name is refused and changes", key: "MedicinalProductDefinition/sakura-bloom-20mg", edit: "MedicinalProductDefinition.name.part[Invented name part]" },
    site: { label: "Packaging site Pack Alpha Group renames itself", key: "Organization/pack-alpha", edit: "Organization.name" },
    ma: { label: "The US application number is updated", key: "RegulatedAuthorization/sakura-bloom-20mg-us", edit: "RegulatedAuthorization.identifier" },
    api: { label: "A new CAS registry number is recorded for Sakuramil", key: "SubstanceDefinition/sakuramil", edit: "SubstanceDefinition.identifier" },
  };
  let scen = null;
  function reuse(main) {
    const keys = Object.keys(D.copies).sort((a, b) => a.localeCompare(b));
    const types = [...new Set(keys.map((k) => k.split("/")[0]))];
    const allSame = Object.values(D.copies).every((c) => c.identical);
    const totalCopies = Object.values(D.copies).reduce((a, c) => a + c.docs, 0);
    main.innerHTML = PT.head("Showcase 2 · Product data across the 20 documents", "Product data resources mapped against the 20 documents that carry them",
      `The ${keys.length} product data resources are copied into each of the 20 documents that use them, under the same identifier and with the same content. Pick a change below: it touches one record, and the documents carrying it follow.`) +
      `<div class="grid g4" style="margin-bottom:16px">
        <div class="stat accent"><b>${keys.length}</b><span>distinct product data resources</span></div>
        <div class="stat"><b>${PT.fmt(totalCopies)}</b><span>copies across the 20 documents</span></div>
        <div class="stat"><b style="color:${allSame ? "var(--ok)" : "var(--bad)"}">${allSame ? "100 %" : "check"}</b><span>copies identical to their master (same id, same content)</span></div>
        <div class="stat"><b>${docs.filter((d) => /SubstanceDefinition/.test(d.comp.subject[0].reference)).length} / ${docs.filter((d) => /MedicinalProduct/.test(d.comp.subject[0].reference)).length}</b><span>documents whose subject is the drug substance / drug product</span></div>
      </div>
      <div class="grid" style="grid-template-columns:minmax(260px,340px) minmax(0,1fr);align-items:start">
        <div class="card sticky"><h3>Change the master data</h3><div id="scen">${Object.entries(SCEN).map(([k, s]) => `<label class="toggle"><input type="radio" name="sc" value="${k}" ${scen === k ? "checked" : ""}><span>${esc(s.label)}<div class="path">${esc(s.edit)}</div></span></label>`).join("")}</div><div id="impact" style="margin-top:10px"></div></div>
        <div class="card flat"><div class="scroll" style="max-height:calc(100vh - 160px);padding:12px 16px"><table class="matrix" id="mx">
          <tr><th></th>${docs.map((d) => `<th class="rot"><div>${esc(d.code)}</div></th>`).join("")}</tr>
          <tr><td class="lbl muted small">Composition.subject</td>${docs.map((d) => `<td title="${esc(d.comp.subject[0].reference)}" style="background:${/Substance/.test(d.comp.subject[0].reference) ? "var(--t3-soft)" : "var(--t1-soft)"};font-size:10px">${/Substance/.test(d.comp.subject[0].reference) ? "DS" : "DP"}</td>`).join("")}</tr>
          ${types.map((t) => `<tr><th colspan="${docs.length + 1}" style="padding-top:10px">${esc(t)}</th></tr>` + keys.filter((k) => k.startsWith(t + "/")).map((k) => `<tr data-k="${esc(k)}"><td class="lbl"><a href="#" data-ref="${esc(k)}">${esc(PT.label(R(k)).slice(0, 46))}</a></td>${docs.map((d, i) => `<td class="${d.carries.includes(k) ? "y" : ""}" data-col="${i}"></td>`).join("")}</tr>`).join("")).join("")}
        </table></div></div>
      </div>`;
    wire(main);
    const show = () => {
      if (!scen) { PT.$("#impact", main).innerHTML = `<p class="muted small">Choose a change to see which documents it reaches.</p>`; return; }
      const s = SCEN[scen], c = D.copies[s.key], m = D.t1Mentions[s.key];
      const row = PT.$(`#mx tr[data-k="${CSS.escape(s.key)}"]`, main);
      PT.$$("#mx tr", main).forEach((tr) => (tr.style.opacity = tr.dataset.k && tr !== row ? 0.35 : 1));
      row.querySelectorAll("td.y").forEach((td) => { td.classList.remove("flash"); void td.offsetWidth; td.classList.add("flash"); });
      row.scrollIntoView({ block: "center", behavior: "smooth" });
      PT.$("#impact", main).innerHTML = `<div class="callout"><b>Type 2:</b> edit <b>1</b> record; <b>${c.docs}</b> document${c.docs > 1 ? "s" : ""} carry it and update with it.</div>
        <div class="callout" style="margin-top:8px;border-color:var(--warn);background:var(--warn-soft)"><b>Narrative:</b> ${m && m.total ? `“${esc(m.term)}” is still written out <b>${PT.fmt(m.total)}</b> time${m.total > 1 ? "s" : ""} in ${m.hits.length} section${m.hits.length > 1 ? "s" : ""} of the Type 1/2 narrative. Type 2 leaves prose unchanged; <a href="type3.html">Type 3</a> links it to the record and <a href="type4.html">Type 4</a> can generate it.` : `this value does not appear in the narrative at all: in Type 1 it was not in the dossier as data.`}</div>`;
    };
    PT.$$("#scen input", main).forEach((i) => i.onchange = () => { scen = i.value; show(); });
    show();
  }

  PT.shell({
    type: 2,
    foot: "Data: <span class='mono'>sakura-bloom-r2/fhir/pqi-types/type2</span>. The marketing authorization is made up for the examples, and values marked † fill gaps in the example data.",
    views: [
      { id: "added", title: "Product data added in Type 2", sub: "Type 1 table next to the structured data", render: added },
      { id: "reuse", title: "Product data across the 20 documents", sub: "Which documents carry each record", render: reuse },
    ],
  });
})();
</script>
</body>
</html>
