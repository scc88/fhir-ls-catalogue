<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structured CMC Review – Sakura Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One light design language merging three directions:
   Keynote (editorial overview), Cards (grouped working views), Pro (sidebar + inspector layout).
   Light only by design: no dark theme. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #d2d2d7;
  --sep: #e5e5ea;
  --fill: #f2f2f7;
  --accent: #0071e3;
  --accent-soft: #eaf3fe;
  --ok: #248a3d; --ok-soft: #e8f7ec;
  --warn: #b25000; --warn-soft: #fff3e0;
  --bad: #d70015; --bad-soft: #ffeceb;
  --info-soft: #f2f2f7;
  --c1: #0071e3; --c2: #ff9500; --c3: #5e5ce6; --c4: #34c759;
  --font-display: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 12px;
  --radius-card: 20px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 21px; } h2 { font-size: 28px; } h3 { font-size: 17px; font-weight: 600; letter-spacing: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid rgba(0,113,227,.45); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* top bar: one slim row */
header.top { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--sep); position: relative; z-index: 20; }
.pane-toggle { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; border-radius: 9px; cursor: pointer; color: var(--muted); }
.pane-toggle:hover { background: var(--fill); color: var(--ink); }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { display: inline-flex; align-items: center; padding-right: 12px; border-right: 1px solid var(--line, #d2d2d7); }
.logo img { height: 26px; width: auto; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.brand-text small { font-size: 11.5px; color: var(--muted); }
.backlink { font-size: 12px; margin-left: 8px; }
.vh { position: absolute; left: -9999px; }
.search { margin-left: auto; position: relative; flex: 0 1 360px; min-width: 180px; }
.search input { width: 100%; padding: 8px 14px; border: 0; border-radius: 10px; background: var(--fill); }
.search ul { position: absolute; right: 0; left: 0; top: calc(100% + 6px); z-index: 30; margin: 0; padding: 6px; list-style: none; background: var(--surface); border-radius: 14px; max-height: 380px; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.14), 0 0 0 1px rgba(0,0,0,.04); }
.search li button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.search li button:hover, .search li button:focus-visible { background: var(--accent-soft); }
/* left pane: product + views, collapsible */
.pane { width: 252px; overflow: auto; background: rgba(246,246,248,.92); border-right: 1px solid var(--sep); padding: 14px 10px 16px; display: flex; flex-direction: column; gap: 6px; transition: width .2s ease, padding .2s ease; }
.app.pane-closed .pane { width: 0; padding-left: 0; padding-right: 0; border-right: 0; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .pane { transition: none; } }
.pane-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px 4px; }
.product { background: var(--surface); border-radius: 14px; padding: 4px 4px 10px; margin-bottom: 6px; }
.prod-name { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 10px 8px; font-size: 15px; font-weight: 700; line-height: 1.3; cursor: pointer; color: var(--ink); border-radius: 8px; }
.prod-name:hover { color: var(--accent); }
.product dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; margin: 0; padding: 0 10px; font-size: 12.5px; }
.product dt { color: var(--muted); } .product dd { margin: 0; font-weight: 500; }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.tabs a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--ink); font-size: 14px; text-decoration: none; white-space: nowrap; }
.tabs a svg { color: var(--accent); flex: none; }
.tabs a:hover { background: rgba(0,0,0,.05); text-decoration: none; }
.tabs a[aria-current="page"] { background: var(--accent); color: #ffffff; font-weight: 600; }
.tabs a[aria-current="page"] svg { color: #ffffff; }
.pane-foot { margin: auto 10px 0; padding-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.workspace { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; }
main { overflow: auto; padding: 28px 32px 48px; min-width: 0; }
main > * { max-width: 1600px; margin-left: auto; margin-right: auto; }
.view-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.view-head h2 { font-size: 34px; font-weight: 800; }
.view-head p { margin: 0; color: var(--muted); max-width: 72ch; font-size: 17px; }

/* cards: grouped, Cards style */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
.card { background: var(--surface); border-radius: var(--radius-card); padding: 20px 22px; min-width: 0; }
.card h3 { margin-bottom: 10px; }
.card.accent { box-shadow: inset 0 0 0 2px var(--accent-soft); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 980px; font-size: 13px; border: 0; background: var(--fill); color: var(--ink); white-space: nowrap; font-weight: 500; }
button.chip, a.chip { cursor: pointer; text-decoration: none; }
button.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.chip.near { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.fail { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.chip.info { background: var(--fill); color: var(--muted); }
.chip.type { font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--sep); padding: 8px 10px; position: sticky; top: 0; background: var(--surface); }
table.t td { border-bottom: 1px solid var(--sep); padding: 10px; vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--accent-soft); }
.scroll { overflow-x: auto; }
.btn { border: 0; background: var(--fill); padding: 9px 18px; border-radius: 980px; cursor: pointer; font-size: 15px; color: var(--ink); }
.btn:hover { background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: #ffffff; }
.btn.primary:hover { background: #0077ed; color: #ffffff; }
.seg { display: inline-flex; background: #e3e3e8; border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; border-radius: 8px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-bottom: 16px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
.controls select, .controls input[type=number] { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: 440px; }
.big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.statrow { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.stat small { display: block; color: var(--muted); font-size: 13px; }
.note { font-size: 13px; color: var(--muted); }

/* overview: Keynote style */
.hero { text-align: center; padding: 56px 16px 40px; }
.hero .eyebrow { margin: 0 0 12px; font-size: 19px; font-weight: 600; color: var(--accent); }
.hero h2 { font-size: clamp(40px, 6vw, 72px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
.hero p.lede { margin: 20px auto 0; max-width: 640px; font-size: 21px; line-height: 1.45; color: var(--muted); }
.hero .ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
.bignums { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; text-align: center; padding: 8px 0 40px; }
.bignums .n { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.bignums .l { color: var(--muted); font-size: 15px; }
.section-title { font-size: 40px; font-weight: 800; text-align: center; margin: 24px 0 6px; }
.section-sub { text-align: center; color: var(--muted); font-size: 19px; margin: 0 auto 24px; max-width: 640px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
.compare > div { padding: 32px; min-width: 0; border-radius: 28px; }
.compare .pdf { background: #e8e8ed; }
.compare .fhir { background: var(--surface); box-shadow: 0 0 0 2px var(--accent) inset; }
.compare h3 { font-size: 26px; font-weight: 800; line-height: 1.15; margin: 4px 0 16px; }
.compare .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.compare .fhir .label { color: var(--accent); }
.doclist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; font-size: 14px; }
.doclist li { display: flex; gap: 10px; align-items: baseline; }
.doclist li::before { content: "PDF"; font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 1px 5px; flex: none; }
.q { font-weight: 600; margin: 0 0 6px; }
.asklist { background: var(--surface); border-radius: var(--radius-card); overflow: hidden; }
.asklist button { display: flex; width: 100%; align-items: center; gap: 14px; padding: 15px 20px; background: none; border: 0; border-bottom: 1px solid var(--sep); text-align: left; cursor: pointer; font-size: 15px; }
.asklist button:last-child { border-bottom: 0; }
.asklist button:hover { background: var(--accent-soft); }
.asklist .hint { color: var(--muted); font-size: 14px; margin-left: auto; }
.asklist .chev { color: #c7c7cc; font-size: 20px; }

/* CTD navigator: Pro layout, light */
.ctd { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; gap: 16px; align-items: start; }
.tree { position: sticky; top: 0; max-height: calc(100vh - 110px); overflow: auto; padding: 10px; }
.tree ul { list-style: none; margin: 0; padding-left: 0; }
.tree button { display: flex; justify-content: space-between; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
.tree button[aria-current="true"] { background: var(--accent); color: #ffffff; font-weight: 600; }
.tree button[aria-current="true"] .n { color: #ffffff; opacity: .85; }
.tree button:hover { background: var(--fill); }
.tree button[aria-current="true"]:hover { background: var(--accent); }
.tree .n { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
.narr { max-width: 100ch; }
.narr table { border-collapse: collapse; font-size: 13px; margin: 10px 0 16px; display: block; overflow-x: auto; }
.narr table { border: 0; }
.narr td { border: 0; border-bottom: 1px solid var(--sep); padding: 6px 8px; vertical-align: top; }
.narr tr:first-child td { background: var(--fill); font-weight: 600; }
.narr h3, .narr h4, .narr h5, .narr h6 { margin: 18px 0 6px; font-size: 17px; }
.narr p { margin: 6px 0; max-width: 80ch; line-height: 1.6; }
.linked { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }

/* control strategy */
.cs td.cqa { font-weight: 600; }
.cs .chip { white-space: normal; text-align: left; border-radius: 12px; max-width: 260px; }
.cs td { min-width: 120px; }
.ctype { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* charts */
svg text { fill: var(--muted); font-family: var(--font-body); font-size: 12px; }
svg .grid line { stroke: var(--sep); }
svg .limit { stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 2; }
svg .limittext { fill: var(--warn); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }

/* process */
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
.step .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
.step.crit .dot { background: var(--warn-soft); color: var(--warn); }
.ctl { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-top: 10px; }
.ctl button { text-align: left; border: 0; border-radius: 14px; background: var(--fill); padding: 10px 12px; cursor: pointer; }
.ctl button:hover { background: var(--accent-soft); }
.ctl .k { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; }
.ctl .cpp .k { color: var(--warn); }
.ctl .ipc .k { color: var(--accent); }

/* inspector: Pro style, light */
aside.insp { width: 0; overflow: hidden; border-left: 1px solid var(--sep); background: var(--surface); transition: width .2s ease; }
aside.insp.open { width: min(460px, 92vw); overflow: auto; }
@media (prefers-reduced-motion: reduce) { aside.insp { transition: none; } }
.insp-in { padding: 20px; display: grid; gap: 14px; }
.insp-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.insp pre { background: #f7f7f9; border-radius: 12px; padding: 12px; overflow: auto; max-height: 420px; font-size: 11.5px; margin: 0; color: #3a3a3c; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.bar { height: 8px; background: var(--sep); border-radius: 4px; position: relative; min-width: 80px; }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--ok); }
.backlink { color: var(--accent); }
@media (max-width: 860px) {
  main { padding: 20px 16px 40px; }
  .ctd { grid-template-columns: 1fr; } .tree { position: static; max-height: 260px; }
  .compare { grid-template-columns: 1fr; }
  aside.insp.open { position: fixed; inset: 0 0 0 auto; z-index: 40; width: 100vw; }
  .pane { position: fixed; top: 52px; bottom: 0; left: 0; z-index: 35; box-shadow: 8px 0 30px rgba(0,0,0,.12); }
  .brand-text small, .backlink { display: none; }
}

/* post-NOC intake */
.chip.lvl4 { background: #e8f7ec; color: #1d7a36; font-weight: 600; }
.chip.lvl3 { background: #eaf3fe; color: #0060c0; font-weight: 600; }
.chip.lvl2 { background: var(--fill); color: var(--muted); }
.chip.lvl1 { background: #ffeceb; color: #c4000f; font-weight: 600; }
.pipeline { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 0; margin: 0 0 16px; counter-reset: p; }
.pipeline li { background: var(--surface); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; position: relative; counter-increment: p; }
.pipeline li::before { content: counter(p); position: absolute; top: 10px; right: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.pipeline b { font-size: 14px; } .pipeline span { font-size: 12.5px; color: var(--muted); }
.pipeline li b::before { content: "✓ "; color: var(--ok); }
.grad-wrap { position: relative; padding-top: 4px; }
.grad { position: relative; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #34c759 0%, #a8d84e 18%, #ffcc00 42%, #ff9500 66%, #ff3b30 100%); }
.grad-wrap.big .grad { height: 16px; border-radius: 8px; }
.grad-mark { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--ink); opacity: .55; }
.grad-mark.sel { width: 20px; height: 20px; margin: -10px 0 0 -10px; opacity: 1; box-shadow: 0 0 0 3px var(--ink), 0 2px 8px rgba(0,0,0,.25); }
.grad-zones { display: flex; margin-top: 8px; font-size: 12px; font-weight: 600; }
.grad-zones span { border-left: 1px solid var(--line); padding-left: 6px; line-height: 1.25; }
.grad-zones small { font-weight: 400; color: var(--muted); }
.grad-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.intake { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.inbox { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; }
.inbox-item { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 0; background: var(--surface); border-radius: 16px; padding: 12px 14px; cursor: pointer; }
.inbox-item:hover { box-shadow: 0 0 0 2px var(--accent-soft) inset; }
.inbox-item.sel { box-shadow: 0 0 0 2px var(--accent) inset; }
.ib-top, .ib-bot { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.ib-top { justify-content: space-between; }
.mini { flex: 1; height: 6px; border-radius: 3px; background: var(--sep); position: relative; overflow: hidden; }
.mini span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #34c759, #ffcc00, #ff9500, #ff3b30); background-size: 340px 100%; border-radius: 3px; }
.view-head.full p { max-width: none; }
.crumbs { display: flex; gap: 14px; align-items: baseline; margin: -28px 0 6px; padding: 30px 0 10px; font-size: 14px; position: sticky; top: -28px; z-index: 6; background: var(--bg); box-shadow: 0 1px 0 var(--line, #d2d2d7); }
.crumbs a { color: var(--accent); text-decoration: none; font-weight: 600; }
.inbox { max-height: calc(100vh - 170px); overflow-y: auto; padding: 2px; top: 28px !important; }
.queue tr.qrow { cursor: pointer; }
.queue tr.qrow:hover td { background: var(--accent-soft); }
.queue td.go { color: var(--accent); font-weight: 600; white-space: nowrap; text-align: right; }
button.grad-mark { padding: 0; cursor: pointer; }
button.grad-mark { border: 0; } button.grad-mark:hover, button.grad-mark:focus-visible { transform: scale(1.3); opacity: 1; }
.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cat-card { box-shadow: inset 0 0 0 2px var(--sep); }
.cat-card.lvl1 { box-shadow: inset 0 0 0 2px #ffb3ad; } .cat-card.lvl3 { box-shadow: inset 0 0 0 2px #b8d6fb; } .cat-card.lvl4 { box-shadow: inset 0 0 0 2px #b4e5c1; }
.cat-level { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 2px 0 6px; }
.esc { background: var(--warn-soft); color: #7a3800; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin: 0 0 10px; }
.conds { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.conds li { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.conds .chip { justify-self: start; }
@media (max-width: 860px) { .intake { grid-template-columns: 1fr; } .inbox { position: static; } .conds li { grid-template-columns: 1fr; } }
.pn-diff{table-layout:fixed;width:100%}.pn-diff th:nth-child(1){width:34%}.pn-diff th:nth-child(2){width:36%}.pn-diff td{overflow-wrap:anywhere}.pn-diff td.mono{font-size:12px}.pn-diff td>*{white-space:normal;max-width:100%;text-align:left;height:auto}
</style>
</head>
<body>
<div class="app">

<script>
"use strict";
const RES = JSON.parse(document.getElementById("fhir").textContent);
const SRC = JSON.parse(document.getElementById("sources").textContent);
const db = PQI.load(RES);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const get = (k) => db.byKey.get(k);
const all = (t) => db.byType.get(t) || [];
const T = PQI.ccText;
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];

// ---------- evaluation helpers
const evalCache = new Map();
function ev(o) { if (!evalCache.has(o.id)) evalCache.set(o.id, PQI.evaluate(db, o)); return evalCache.get(o.id); }
const STATUS_LABEL = { pass: "Within limit", near: "Near limit", fail: "Out of limit", info: "Reported" };
function chipStatus(s, text) { return `<span class="chip ${s}">${esc(text || STATUS_LABEL[s])}</span>`; }
function refBtn(k, text, cls = "chip") { return `<button type="button" class="${cls}" data-open="${esc(k)}">${esc(text || PQI.label(get(k)))}</button>`; }
function srcTitle(u) { return SRC[u] || u; }
function critText(od, ctx) { const c = PQI.criterion(od, ctx); return c ? c.text : ""; }
function odShort(od) { return od.title; }
function subjLabel(r) { return r.resourceType === "Medication" ? PQI.label(r) : "DS batch " + PQI.label(r); }

// ---------- header facts
(function facts() {
  const mpd = all("MedicinalProductDefinition")[0];
  const sd = get("SubstanceDefinition/sakuramil");
  const ch = (t) => (mpd.characteristic || []).find((c) => T(c.type) === t);
  $("#facts").innerHTML = `<div class="pane-label">Product under review</div>
    <button type="button" class="prod-name" data-open="MedicinalProductDefinition/${esc(mpd.id)}">${esc(mpd.name[0].productName)}</button>
    <dl>${[
    ["Dose form", T(mpd.combinedPharmaceuticalDoseForm)],
    ["Strength", "20 mg Sakuramil (base)"],
    ["Route", T(mpd.route[0])],
    ["Max daily dose", ch("Maximum daily dose").valueQuantity.value + " mg"],
    ["Packs", all("PackagedProductDefinition").length],
    ["FHIR resources", RES.length.toLocaleString()],
  ].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
})();

// ---------- routing
const VIEWS = [
  ["overview", "Overview", viewOverview],
  ["ctd", "CTD navigator", viewCtd],
  ["control-strategy", "Control strategy", viewControl],
  ["specifications", "Specifications", viewSpecs],
  ["batches", "Batches & genealogy", viewBatches],
  ["stability", "Stability", viewStability],
  ["process", "Manufacturing process", viewProcess],
  ["trace", "Trace an attribute", viewTrace],
  ["change-impact", "Change impact", viewImpact],
  ["post-noc-intake", "Post-NOC intake", viewIntake],
];
const ICONS = {"post-noc-intake": "<path d=\"M4 13l2.5-8h11L20 13v6H4z\"/><path d=\"M4 13h5l1 2h4l1-2h5\"/>", "overview": "<path d=\"M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-4H4z\"/>", "ctd": "<path d=\"M6 3h9l4 4v14H6z\"/><path d=\"M9 12h7M9 16h5\"/>", "control-strategy": "<path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"/><path d=\"M9 12l2 2 4-4\"/>", "specifications": "<path d=\"M9 6h11M9 12h11M9 18h11\"/><path d=\"M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2\"/>", "batches": "<circle cx=\"6\" cy=\"6\" r=\"2.5\"/><circle cx=\"18\" cy=\"6\" r=\"2.5\"/><circle cx=\"12\" cy=\"18\" r=\"2.5\"/><path d=\"M6 8.5v2l6 5M18 8.5v2l-6 5\"/>", "stability": "<path d=\"M4 19l5-6 4 3 7-9\"/><path d=\"M4 4v15h16\"/>", "process": "<path d=\"M4 6h16M4 12h10M4 18h7\"/>", "trace": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/>", "change-impact": "<path d=\"M12 4l9 16H3z\"/><path d=\"M12 10v4M12 17v.5\"/>"};
$("#tabs").innerHTML = VIEWS.map(([id, t]) => `<a href="#${id}" data-v="${id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id] || ""}</svg><span>${esc(t)}</span></a>`).join("");
(function pane() {
  const btn = $("#paneToggle"), app = document.querySelector(".app");
  const narrow = () => window.matchMedia("(max-width: 860px)").matches;
  let open = !narrow();
  try { const s = localStorage.getItem("pqi-pane"); if (s && !narrow()) open = s === "open"; } catch (e) {}
  const apply = () => { app.classList.toggle("pane-closed", !open); btn.setAttribute("aria-expanded", String(open)); btn.setAttribute("aria-label", open ? "Hide navigation pane" : "Show navigation pane"); };
  btn.addEventListener("click", () => { open = !open; apply(); try { localStorage.setItem("pqi-pane", open ? "open" : "closed"); } catch (e) {} });
  $("#tabs").addEventListener("click", () => { if (narrow()) { open = false; apply(); } });
  apply();
})();
const STATE = { ctdSection: null, spec: "spec-dp", stab: { prod: "DP", od: "od-dp-assay-hplc", pack: "all", cond: "25 °C / 60 % RH (long-term)" }, proc: "dp", trace: "CP-9-1", impact: null, batch: "ABC123" };
function route() {
  const [h, sub] = decodeURIComponent((location.hash || "#overview").slice(1)).split("/");
  const v = VIEWS.find((x) => x[0] === h) || VIEWS[0];
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.v === v[0] ? "page" : "false"));
  const main = $("#view");
  main.innerHTML = "";
  v[2](main, sub);
  main.scrollTop = 0;
}
window.addEventListener("hashchange", route);
function go(v) { if (location.hash === "#" + v) route(); else location.hash = v; }

// ---------- global click delegation
document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]");
  if (o) { e.preventDefault(); openInspector(o.dataset.open); return; }
  const g = e.target.closest("[data-go]");
  if (g) {
    e.preventDefault();
    const [v, arg] = g.dataset.go.split("|");
    if (v === "ctd" && arg) STATE.ctdSection = arg;
    if (v === "specifications" && arg) STATE.spec = arg;
    if (v === "trace" && arg) STATE.trace = arg;
    if (v === "stability" && arg) { const [prod, od] = arg.split(":"); STATE.stab.prod = prod; STATE.stab.od = od; STATE.stab.cond = prod === "DP" ? "25 °C / 60 % RH (long-term)" : "30 ± 2 °C / 75 ± 5 % RH"; }
    if (v === "change-impact" && arg) STATE.impact = arg;
    go(v);
  }
});

// Overview
function viewOverview(el) {
  const obs = all("Observation");
  const counts = { pass: 0, near: 0, fail: 0, info: 0 };
  obs.forEach((o) => counts[ev(o).status]++);
  const ranked = obs.map((o) => ({ o, e: ev(o) })).filter((x) => x.e.margin != null && x.o.valueQuantity && !x.o.valueQuantity.comparator).sort((a, b) => a.e.margin - b.e.margin).slice(0, 5);
  const od = get("ObservationDefinition/od-dp-degradation-cp-9-1");
  const rs = PQI.resultsFor(db, od.id);
  const maxR = rs.filter((r) => r.obs.valueQuantity).sort((a, b) => b.obs.valueQuantity.value - a.obs.valueQuantity.value)[0];
  const involved = new Set(["ObservationDefinition/" + od.id]);
  rs.forEach((r) => { if (r.report) involved.add("DiagnosticReport/" + r.report.id); });
  const ap = db.apOf.get(od.id); if (ap) involved.add("PlanDefinition/" + ap.id);
  const docs = [...PQI.sourcesOf(db, involved)].map(srcTitle);
  const sd = get("SubstanceDefinition/sakuramil");
  const mpd = all("MedicinalProductDefinition")[0];
  const specs = all("PlanDefinition").filter((p) => p.id.startsWith("spec-")).length;
  const sections = countSections();
  const ctx = (x) => { const si = PQI.specimenInfo(db, x.o); return subjLabel(get(x.o.subject.reference)) + (si ? " · " + si.condition.replace(/ \(.*\)/, "") + " · " + si.months + " mo" : ""); };
  el.innerHTML = `
  <section class="hero">
    <p class="eyebrow">For quality assessors at FDA, Health Canada, PMDA, HSA, EMA and TGA</p>
    <h2>Review the dossier.<br>Not the documents.</h2>
    <p class="lede">CTD Module 2.3 and 3.2 for Sakura Bloom 20 mg, delivered as ${RES.length.toLocaleString()} linked HL7 FHIR PQI resources. Every limit knows its method. Every result knows its limit.</p>
    <div class="ctas"><button class="btn primary" data-go="ctd">Start reviewing</button><button class="btn" data-go="trace|CP-9-1">See how it compares to PDF</button></div>
  </section>
  <div class="bignums">
    <div><div class="n">${RES.length.toLocaleString()}</div><div class="l">linked FHIR resources</div></div>
    <div><div class="n">${obs.length.toLocaleString()}</div><div class="l">results checked against their limit</div></div>
    <div><div class="n" style="color:${counts.fail ? "var(--bad)" : "var(--ok)"}">${counts.fail}</div><div class="l">out of limit</div></div>
    <div><div class="n">${specs}</div><div class="l">specifications, as data</div></div>

function controlRows() {
  const c = get("Composition/module-2-3-quality-overview");
  const sec = c.section.find((s) => s.title.startsWith("2.3.2"));
  const doc = new DOMParser().parseFromString(sec.text.div, "text/html");
  const tbl = [...doc.querySelectorAll("table")].find((t) => /Product Attribute/.test(t.rows[0].textContent));
  const rows = []; let pa = "", cqa = "", fr = "";
  [...tbl.rows].slice(1).forEach((r) => {
    const c = [...r.cells].map((x) => x.textContent.trim());
    if (c[0]) pa = c[0]; if (c[1]) cqa = c[1]; if (c[2]) fr = c[2];
    rows.push({ pa, cqa, rel: c[2] || "", type: c[3], desc: c[4], loc: (c[5] || "").replace(/\[\[|\]\]/g, "").trim() });
  });
  return rows;
}
function matchControl(r) {
  if (/starting material|reagent|intermediate|excipient|Pd criteria|,/i.test(r.desc)) return null;
  const words = (r.desc + " " + r.cqa).toLowerCase().replace(/[()]/g, " ").split(/[^a-z0-9-]+/).filter((w) => w.length > 2 && !["criterion", "criteria", "the", "and", "for", "product", "drug", "specification"].includes(w));
  let best = null, bs = 0;
  for (const od of all("ObservationDefinition")) {
    const isDP = /^(od-dp|ipc-dp|cpp-dp)/.test(od.id), isDS = /^(od-ds|ipc-ds|cpp-ds)/.test(od.id);
    if (/^DS /.test(r.desc) && !isDS) continue;
    if (/^DP /.test(r.desc) && !isDP) continue;
    if (r.type === "CPP" && !od.id.startsWith("cpp")) continue;
    if (r.type === "IPC" && !od.id.startsWith("ipc") && !od.id.startsWith("od-")) continue;
    if (/Specification/.test(r.type) && !od.id.startsWith("od-")) continue;
    if (!isDP && !isDS) continue;
    const t = (od.title + " " + T(od.code)).toLowerCase();
    let s = 0; words.forEach((w) => { if (t.includes(w)) s += ["nir", "hplc", "rtrt", "uv"].includes(w) ? 2 : 1; });
    if (s > bs) { bs = s; best = od; }
  }
  return bs >= 2 || (bs >= 1 && r.type === "CPP") ? best : null;
}

function chart(series, crit, lots) {

  if (!vals.length) return '<p class="muted">No numeric results for this selection.</p>';
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo || 1) * 0.12; lo -= pad; hi += pad; if (lo < 0 && Math.min(...vals) >= 0) lo = 0;
  const x = (t) => L + (t / 36) * (W - L - R), y = (v) => Tp + (1 - (v - lo) / (hi - lo)) * (H - Tp - B);
  const ticks = []; const step = niceStep((hi - lo) / 5); for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(+v.toFixed(6));

  ${ticks.map((v) => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="num">${v}</text>`).join("")}
  ${months.map((m) => `<text x="${x(m)}" y="${H - B + 16}" text-anchor="middle">${m}</text>`).join("")}<text x="${(W + L) / 2}" y="${H - 4}" text-anchor="middle">months on station</text>`;
  if (r && r.high) out += `<line class="limit" x1="${L}" x2="${W - R}" y1="${y(r.high.value)}" y2="${y(r.high.value)}"/><text class="limittext" x="${W - R}" y="${y(r.high.value) - 5}" text-anchor="end">NMT ${r.high.value}</text>`;
  if (r && r.low) out += `<line class="limit" x1="${L}" x2="${W - R}" y1="${y(r.low.value)}" y2="${y(r.low.value)}"/><text class="limittext" x="${W - R}" y="${y(r.low.value) + 14}" text-anchor="end">NLT ${r.low.value}</text>`;
  series.forEach((s) => {

    out += s.points.map((p, i) => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${i === s.points.length - 1 ? 4.5 : 3.2}" fill="${p.cmp ? "var(--surface)" : col}" stroke="${col}" stroke-width="1.5" data-open="Observation/${p.obs.id}" style="cursor:pointer"><title>${esc(s.lot)} ${esc(s.pack)} ${p.t} mo: ${p.cmp || ""}${p.v}</title></circle>`).join("");

}

  </div><p class="note" style="margin:8px 0 0">Current criterion${im.ctx ? " (" + esc(im.ctx) + ")" : ""}: <b>${esc(cur ? cur.text : "")}</b></p></div><div id="iout"></div>`;
  const assess = () => {
    const unit = (cur.range.high || cur.range.low).unit;
    const nr = {}; if (im.lo != null && im.lo !== "") nr.low = { value: +im.lo, unit }; if (im.hi != null && im.hi !== "") nr.high = { value: +im.hi, unit };
    const rs = PQI.resultsFor(db, od.id).filter((r) => ctxs.length < 2 || PQI.contextFor(db, r.obs) === im.ctx);
    const now = rs.map((r) => ({ r, before: ev(r.obs).status, after: PQI.evaluate(db, r.obs, nr).status }));

      <div class="card"><h3>Dossier elements to update</h3><div class="chips">${specs.map((p) => refBtn("PlanDefinition/" + p)).join("")}${back.filter((k) => !specs.some((p) => k === "PlanDefinition/" + p)).map((k) => refBtn(k)).join("")}</div>

    <div class="card scroll"><h3>Results that would no longer conform</h3>${newFail.length ? `<table class="t"><thead><tr><th>Batch</th><th>Study</th><th>Condition / time</th><th class="num">Result</th><th>Now</th><th>Proposed</th></tr></thead><tbody>${newFail.map((x) => `<tr class="click" data-open="Observation/${x.r.obs.id}"><td>${esc(PQI.label(x.r.subject))}</td><td>${esc(x.r.report ? T(x.r.report.code) : "")}</td><td>${x.r.si ? esc(x.r.si.condition) + " · " + x.r.si.months + " mo" : "release"}</td><td class="num">${esc(PQI.valueText(x.r.obs))}</td><td>${chipStatus(x.before)}</td><td>${chipStatus("fail")}</td></tr>`).join("")}</tbody></table>` : '<p class="muted">No existing result would fall outside the proposed range.</p>'}</div>`;
  };
  assess();
  $("#ipreset", el).addEventListener("change", (e) => { if (e.target.value === "") return; const p = PRESETS[+e.target.value]; STATE.impact = { od: p[0], ctx: p[1], lo: p[2], hi: p[3] }; route(); });
  $("#iod", el).addEventListener("change", (e) => { const o = get("ObservationDefinition/" + e.target.value); const q = (o.qualifiedValue || []).find((x) => x.range); STATE.impact = { od: o.id, ctx: q.context ? q.context.text : null, lo: q.range.low ? q.range.low.value : null, hi: q.range.high ? q.range.high.value : null }; route(); });
  const ic = $("#ictx", el); if (ic) ic.addEventListener("change", (e) => { im.ctx = e.target.value; const c = PQI.criterion(od, im.ctx); im.lo = c.range.low ? c.range.low.value : null; im.hi = c.range.high ? c.range.high.value : null; route(); });
  $("#ilo", el).addEventListener("input", (e) => { im.lo = e.target.value === "" ? null : e.target.value; assess(); });
  $("#ihi", el).addEventListener("input", (e) => { im.hi = e.target.value === "" ? null : e.target.value; assess(); });
}

    const tree = (acts, d) => `<ul style="margin:4px 0;padding-left:${d ? 14 : 0}px;list-style:${d ? "disc" : "none"}">${(acts || []).map((a) => { const od = a.definitionCanonical && db.byUrl.get(a.definitionCanonical); return `<li><b>${esc(a.title || T(a.code))}</b>${a.description ? ` <span class="muted">${esc(a.description.length > 180 ? a.description.slice(0, 180) + "…" : a.description)}</span>` : ""}${od ? " " + refBtn(od.resourceType + "/" + od.id, od.resourceType === "ObservationDefinition" ? critText(od).slice(0, 50) || "definition" : od.title || od.id) : ""}${tree(a.action, d + 1)}</li>`; }).join("")}</ul>`;
    body = `<dl class="kv"><dt>Type</dt><dd>${esc(T(r.type))}</dd>${r.subjectReference ? `<dt>Subject</dt><dd>${refBtn(r.subjectReference.reference)}</dd>` : ""}</dl>${r.description ? `<p class="muted">${esc(r.description)}</p>` : ""}<div style="max-height:360px;overflow:auto">${tree(r.action, 0)}</div>`;
  } else {

  box.scrollTop = 0;
}

    if (v.length < 2) { ul.hidden = true; return; }
    FLAT = FLAT || flatSections();
    const secs = FLAT.filter((x) => x.s.title.toLowerCase().includes(v)).slice(0, 6).map((x) => `<li><button type="button" data-go="ctd|${esc(x.id)}"><span class="chip type">Section</span> ${esc(x.s.title)}</button></li>`);
    const hits = idx.filter((x) => x.s.toLowerCase().includes(v)).slice(0, 18).map((x) => `<li><button type="button" data-open="${esc(x.k)}"><span class="chip type">${esc(x.t)}</span> ${esc(x.s)}</button></li>`);
    ul.innerHTML = secs.concat(hits).join("") || '<li class="muted" style="padding:6px 8px">No matches</li>';
    ul.hidden = false;
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) ul.hidden = true; else if (e.target.closest("#qres button")) ul.hidden = true; });
})();

route();
</script>
</body>
</html>
